<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Mis rutas y trails</title>
<meta name="description" content="Rutas de senderismo, trail, carreras y MTB de toda España">
<meta name="theme-color" content="#f4f1ea" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141814" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Mis rutas">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f1ea;--card:#fffdf8;--ink:#1f2a24;--muted:#6b7068;--line:#e3ddcf;
  --green:#2f5d46;--green2:#e3eee6;--orange:#d0662b;--orange2:#fbe9dd;--red:#b33a2f;--red2:#f8e1de;
  --blue:#2b5f8a;--blue2:#e0ebf4;--purple:#6a4a8c;--purple2:#ece4f4;--amber:#a86b00;--amber2:#fbefd2;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#141814;--card:#1d231e;--ink:#ecebe4;--muted:#9aa096;--line:#2e362f;
  --green:#7fbf9b;--green2:#24352b;--orange:#f0955d;--orange2:#3a2a1f;--red:#f08b80;--red2:#3a2321;
  --blue:#8ab8e0;--blue2:#1f2c38;--purple:#c1a3e0;--purple2:#2c2436;--amber:#f1c25b;--amber2:#3a311c;
}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:720px;margin:0 auto;padding:18px 16px 100px}
h1{font:700 30px/1 "Barlow Condensed",sans-serif;letter-spacing:.5px;margin:4px 0 14px;text-transform:uppercase}
h2.sec{font:700 20px "Barlow Condensed",sans-serif;text-transform:uppercase;letter-spacing:.6px;margin:22px 2px 10px;display:flex;align-items:center;justify-content:space-between}
.sub{color:var(--muted);font-size:13px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px}
/* calendario */
.calhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.calhead b{font:700 18px "Barlow Condensed",sans-serif;text-transform:uppercase;letter-spacing:.5px}
.nav{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;width:36px;height:32px;font-size:16px;cursor:pointer}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center}
.cal .dow{font-size:11px;font-weight:600;color:var(--muted);padding:2px 0}
.cal .d{min-height:40px;border-radius:9px;padding:4px 0 2px;font-size:13px;cursor:pointer;position:relative;border:1px solid transparent}
.cal .d.out{opacity:.3}
.cal .d.today{border-color:var(--green)}
.cal .d.sel{background:var(--green2)}
.cal .d .dots{display:flex;justify-content:center;gap:3px;margin-top:3px;min-height:7px}
.dot{width:7px;height:7px;border-radius:50%}
.dot.inscrito{background:var(--green)} .dot.interesado{background:var(--amber)} .dot.hecha{background:var(--muted)}
.legend{display:flex;gap:12px;font-size:12px;color:var(--muted);margin-top:8px;justify-content:center}
.legend span{display:flex;align-items:center;gap:5px}
.alert{background:var(--orange2);border-left:4px solid var(--orange);border-radius:10px;padding:9px 12px;margin-top:10px;font-size:13.5px}
.alert strong{color:var(--orange)}
.notice{background:var(--blue2);border-left:4px solid var(--blue);border-radius:10px;padding:10px 12px;font-size:14px;margin-bottom:12px}
.notice b{color:var(--blue)}
/* listas */
.bar{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:5px 11px;font:500 13px Inter,sans-serif;cursor:pointer;text-decoration:none;display:inline-block}
.chip.on{background:var(--green);border-color:var(--green);color:var(--card)}
.chip.amber{background:var(--amber2);border-color:var(--amber2);color:var(--amber)}
.chip.greenl{background:var(--green2);border-color:var(--green2);color:var(--green)}
.month{font:700 15px "Barlow Condensed",sans-serif;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin:16px 2px 8px}
.ev{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px;display:flex;gap:12px}
.ev.mine{cursor:pointer}
.date{flex:0 0 52px;text-align:center;border-radius:10px;padding:6px 0;background:var(--green2);color:var(--green);align-self:flex-start}
.date.t-trail{background:var(--orange2);color:var(--orange)}
.date.t-carrera{background:var(--blue2);color:var(--blue)}
.date.t-mtb{background:var(--purple2);color:var(--purple)}
.date.t-otro{background:var(--bg);color:var(--muted)}
.date b{display:block;font:700 26px/1 "Barlow Condensed",sans-serif}
.date span{font-size:11px;text-transform:uppercase;font-weight:600}
.body{flex:1;min-width:0}
.title{font-weight:600;font-size:16px;margin-bottom:2px}
.meta{color:var(--muted);font-size:13px}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
.tag{font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:6px;background:var(--bg);color:var(--muted)}
.tag.ok{background:var(--green2);color:var(--green)}
.tag.warn{background:var(--orange2);color:var(--orange)}
.tag.bad{background:var(--red2);color:var(--red)}
.tag.amb{background:var(--amber2);color:var(--amber)}
.empty{text-align:center;color:var(--muted);padding:22px 10px;font-size:14px}
.fab{position:fixed;right:18px;bottom:22px;background:var(--orange);color:#fff;border:0;border-radius:999px;padding:14px 20px;font:600 15px Inter,sans-serif;box-shadow:0 6px 18px rgba(0,0,0,.2);cursor:pointer;z-index:5}
/* mapa */
.mapmini{display:flex;gap:12px;align-items:center;cursor:pointer}
.mapmini svg{width:120px;flex:0 0 120px}
.mapmini .txt{font-size:14px}
.mapmini .txt b{display:block;font-size:15px}
.tile rect{fill:var(--bg);stroke:var(--line);stroke-width:1}
.tile.has rect{fill:var(--green2)}
.tile.sel rect{fill:var(--green);stroke:var(--green)}
.tile text{font:600 9px Inter,sans-serif;fill:var(--muted);text-anchor:middle;pointer-events:none}
.tile.has text{fill:var(--green)}
.tile.sel text{fill:var(--card)}
.tile .n{font-size:8px;font-weight:500}
.bigmap .tile{cursor:pointer}
.bigmap svg{width:100%;max-width:520px;display:block;margin:0 auto}
.provlist{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.dhead{display:flex;align-items:center;justify-content:space-between;cursor:pointer;user-select:none}
.chev{font-size:16px;color:var(--muted);padding-left:8px}
.mapscroll{overflow-x:auto;border-radius:12px;border:1px solid var(--line);-webkit-overflow-scrolling:touch}
.mapinner{position:relative;width:100%}
.mapinner.zoom{width:220%}
.mapinner img{display:block;width:100%;height:auto}
.mapinner svg{position:absolute;inset:0;width:100%;height:100%}
.hot{cursor:pointer}
.hot .hit{fill:transparent;stroke:transparent;stroke-width:2}
.hot.has .hit{stroke:rgba(47,93,70,.55)}
.hot.sel .hit{fill:rgba(47,93,70,.35);stroke:#2f5d46;stroke-width:3}
.hot circle{fill:#2f5d46}
.hot text{fill:#fff;font:700 11px Inter,sans-serif;text-anchor:middle;pointer-events:none}
.hot.sel circle{fill:#d0662b}
.chip.act-int{background:var(--amber);border-color:var(--amber);color:var(--card)}
.chip.act-ins{background:var(--green);border-color:var(--green);color:var(--card)}
.cfm{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:30;padding:20px}
.cfm.show{display:flex}
.cfm .box{background:var(--card);border-radius:16px;padding:20px;max-width:360px;width:100%;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.cfm .box p{margin:0 0 6px;font-size:16px;font-weight:600}
.cfm .box .sub{display:block;margin-bottom:6px}
.btn.danger{background:var(--red);border-color:var(--red);color:var(--card)}
.shareimg{width:100%;border-radius:12px;display:block;border:1px solid var(--line);margin:6px 0 4px}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.wrap{padding-bottom:130px}
.ttl{font:700 28px/1 "Barlow Condensed",sans-serif;text-transform:uppercase;letter-spacing:.5px;margin:8px 2px 14px}
.searchrow{display:flex;gap:10px;align-items:center;position:sticky;top:0;z-index:4;padding:10px 0 8px;background:var(--bg)}
.search{flex:1;display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:0 16px;height:52px;box-shadow:0 2px 10px rgba(0,0,0,.06);color:var(--muted)}
.search input{border:0;background:transparent;padding:0;height:100%;font-size:17px;color:var(--ink);outline:none;width:100%}
.search input::-webkit-search-cancel-button{opacity:.6}
.filtbtn{height:52px;padding:0 20px;border-radius:999px;border:1px solid var(--green2);background:var(--green2);color:var(--ink);font:600 16px Inter,sans-serif;cursor:pointer;display:flex;align-items:center;gap:6px;white-space:nowrap}
.filtbtn span:not(:empty){background:var(--green);color:var(--card);border-radius:999px;font-size:12px;min-width:20px;height:20px;display:inline-flex;align-items:center;justify-content:center;padding:0 6px}
.count{color:var(--muted);font-size:14px;margin:6px 2px 4px}
.hscroll{display:flex;gap:6px;overflow-x:auto;padding:6px 0 4px;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.hscroll .chip{flex:0 0 auto}
.tabbar{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(3,1fr);padding:6px 8px calc(6px + env(safe-area-inset-bottom));background:var(--card);border-top:1px solid var(--line);box-shadow:0 -2px 12px rgba(0,0,0,.06);z-index:8}
.tabbar a{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0 4px;margin:0 6px;border-radius:14px;color:var(--muted);text-decoration:none;font:600 12px Inter,sans-serif}
.tabbar a svg{width:26px;height:26px}
.tabbar a.on{color:var(--green);background:var(--green2)}
.tabbar .badge{position:absolute;top:4px;left:calc(50% + 8px);background:var(--orange);color:#fff;font:700 10px Inter,sans-serif;font-style:normal;border-radius:999px;min-width:17px;height:17px;display:flex;align-items:center;justify-content:center;padding:0 4px}
.tabbar .badge[hidden],.fab[hidden]{display:none}
.fab{bottom:calc(96px + env(safe-area-inset-bottom))}
.prof{display:flex;align-items:center;gap:14px;margin:10px 2px 16px}
.avatar{width:64px;height:64px;border-radius:50%;background:var(--green);color:var(--card);display:flex;align-items:center;justify-content:center;font:700 30px "Barlow Condensed",sans-serif}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.stat b{display:block;font:700 28px/1.1 "Barlow Condensed",sans-serif}
.stat span{font-size:12.5px;color:var(--muted)}
.plist a{display:block;padding:9px 0;border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink);font-size:14px}
.plist a:last-child{border-bottom:0}
html,body{width:100%;max-width:100%;overflow-x:hidden;-webkit-text-size-adjust:100%;text-size-adjust:100%;touch-action:pan-x pan-y;overscroll-behavior-x:none}
*{-webkit-tap-highlight-color:transparent}
button,a,.chip,.tile,.hot{touch-action:manipulation}
input,select,textarea{font-size:16px}
.mapscroll{touch-action:pan-x pan-y}
.wrap{padding-bottom:calc(100px + env(safe-area-inset-bottom))}
.fab{bottom:calc(84px + env(safe-area-inset-bottom))}
.searchrow{padding-top:calc(10px + env(safe-area-inset-top))}
.sheet{padding-bottom:calc(24px + env(safe-area-inset-bottom))}
.prov{fill:transparent;cursor:pointer;transition:fill .15s}
.prov.sel{fill:rgba(28,66,44,.42);stroke:#1f4a33;stroke-width:1.6;stroke-linejoin:round}
.hot.sel .hit{fill:rgba(255,255,255,.0);stroke:none}
.hot.sel text{fill:#fff}
.ptop{display:flex;justify-content:flex-end;padding-top:calc(6px + env(safe-area-inset-top))}
.pill{display:flex;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 10px;box-shadow:0 2px 10px rgba(0,0,0,.06)}
.pill button{background:none;border:0;color:var(--ink);width:48px;height:42px;display:flex;align-items:center;justify-content:center;cursor:pointer;border-radius:999px}
.phead{display:flex;gap:16px;margin-top:22px;align-items:stretch}
.pphoto-col{flex:0 0 120px;display:flex;flex-direction:column;gap:8px}
.pphoto{width:120px;height:120px;border-radius:16px;overflow:hidden;background:var(--green2);border:3px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--green);cursor:pointer;-webkit-touch-callout:none;user-select:none;-webkit-user-select:none;transition:transform .15s}
.pphoto.press{transform:scale(.95)}
.pphoto img{width:100%;height:100%;object-fit:cover;pointer-events:none;-webkit-user-drag:none}
.pnum{background:var(--line);border-radius:8px;text-align:center;font:600 17px Inter,sans-serif;padding:4px 0}
.pinfo{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:space-between;padding-bottom:40px}
.pedit{align-self:flex-end;background:var(--green2);color:var(--green);border:0;border-radius:999px;padding:9px 20px;font:700 17px Inter,sans-serif;cursor:pointer}
.pname{font-weight:800;font-size:clamp(16px,5.1vw,26px);line-height:1.15;overflow-wrap:anywhere}
.psince{color:var(--muted);font-size:14.5px;margin-top:6px}
.pcount{display:grid;grid-template-columns:repeat(3,1fr);margin-top:20px;text-align:center}
.pcount button{background:none;border:0;color:var(--ink);cursor:pointer;padding:6px 0}
.pcount b{display:block;font:500 22px Inter,sans-serif}
.pcount span{color:var(--muted);font-size:15px}
.frow{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)}
.ev{position:relative}
.ev .title{padding-right:34px}
.shbtn{position:absolute;top:8px;right:8px;width:34px;height:34px;border-radius:50%;border:0;background:transparent;color:var(--muted);display:flex;align-items:center;justify-content:center;cursor:pointer}
.shbtn:active{background:var(--bg)}
#toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:var(--ink);color:var(--card);padding:11px 16px;border-radius:12px;font:500 14px Inter,sans-serif;opacity:0;pointer-events:none;transition:all .2s;z-index:40;max-width:88%;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
.shbtn{-webkit-touch-callout:none;user-select:none;-webkit-user-select:none}
.shtitle{font:700 22px "Barlow Condensed",sans-serif;text-transform:uppercase}
.shname{color:var(--muted);font-size:14px;margin:2px 0 14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.shapps{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.shapps a,.shapps button{display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;color:var(--ink);text-decoration:none;font:500 12.5px Inter,sans-serif;cursor:pointer;padding:6px 0}
.shapps svg{width:54px;height:54px}
.sheet.cfg{background:var(--bg);max-height:96vh;min-height:80vh}
.cfghead{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.cfgx{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:20px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.cfgtitle{font:700 18px Inter,sans-serif}
.cfggroup{background:var(--card);border-radius:18px;overflow:hidden;margin-bottom:18px}
.cfggroup button{display:flex;width:100%;align-items:center;justify-content:space-between;background:none;border:0;border-bottom:1px solid var(--line);margin-left:0;padding:15px 16px;font:400 16.5px Inter,sans-serif;color:var(--ink);cursor:pointer;text-align:left}
.cfggroup button:last-child{border-bottom:0}
.cfggroup button svg{color:var(--muted);flex:0 0 auto}
.cfggroup .prem{color:var(--orange)}
.cfgright{display:flex;align-items:center;gap:8px}
.star{background:var(--orange);color:#fff;border-radius:50%;width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;font-size:13px}
.cfgfoot{text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px;margin-top:8px}
.cfgfoot b{font-size:17px}
.cfgfoot span{color:var(--muted);font-size:14px}
.cfgdanger{margin-top:18px;background:var(--card);border:0;border-radius:999px;padding:11px 26px;font:500 15px Inter,sans-serif;color:var(--red);cursor:pointer}
.cfgver{color:var(--muted);font-size:12.5px;margin-top:14px}
.cfglabel{font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin:14px 6px 6px}
.cfgbox{background:var(--card);border-radius:18px;padding:14px 16px}
.cfgradio button{display:flex;width:100%;justify-content:space-between;background:none;border:0;border-bottom:1px solid var(--line);padding:12px 2px;font:400 16px Inter,sans-serif;color:var(--ink);cursor:pointer}
.cfgradio button:last-child{border-bottom:0}
.cfgradio button span{color:var(--green);font-weight:700}
.help p{margin:0 0 12px;font-size:14.5px;line-height:1.5}
.help p:last-child{margin-bottom:0}
/* app shell: la página no hace scroll; solo el contenido. Así la barra inferior nunca se mueve */
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{position:fixed;inset:0}
#scroller{position:absolute;top:0;left:0;right:0;bottom:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain}
.tabbar{transform:translateZ(0);will-change:transform}
#scroller{padding-top:env(safe-area-inset-top)}
.install{display:flex;gap:12px;align-items:flex-start;background:var(--green2);color:var(--ink);border-radius:16px;padding:12px 14px;margin:0 0 12px;font-size:14px;line-height:1.4}
.install b{display:block;font-size:15px}
.install button{margin-left:auto;background:none;border:0;color:var(--muted);font-size:18px;cursor:pointer;padding:0 2px}
.cfggroup .cfgsub{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.acard{background:var(--green2);border-radius:18px;padding:14px 16px;margin:4px 0 16px}
.acard b{display:block;font-size:16px}.acard span{color:var(--muted);font-size:14px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--bg);border-radius:12px;padding:3px;margin-bottom:6px}
.seg button{border:0;background:none;padding:9px;border-radius:10px;font:600 14px Inter,sans-serif;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.1)}
.chk{display:flex;gap:8px;align-items:flex-start;font-weight:400 !important;font-size:13.5px;line-height:1.4;margin-top:12px}
.chk input{width:auto !important;margin-top:2px}.chk a{color:var(--green)}
.amsg{min-height:20px;font-size:13.5px;color:var(--red);margin-top:8px}
.alink{background:none;border:0;color:var(--green);font:500 14px Inter,sans-serif;padding:10px 0 0;cursor:pointer;display:block;margin:0 auto}
.ordiv{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px;margin:14px 0}
.ordiv:before,.ordiv:after{content:"";flex:1;height:1px;background:var(--line)}
.sso{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:600 15px Inter,sans-serif;cursor:pointer;margin-bottom:8px}
.crow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid var(--line);font-size:16.5px}
.cfggroup .cdel{color:var(--red)}
.av{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;background:var(--green2);color:var(--green);font-weight:700;overflow:hidden;flex:0 0 auto}
.av img{width:100%;height:100%;object-fit:cover}
.cfgbox .av{font-size:18px}
.prow,.frow{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}
.prow:last-child,.frow:last-child{border-bottom:0}
.prow[data-open]{cursor:pointer}
.finfo{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.finfo b{font-size:15.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.finfo span{color:var(--muted);font-size:13.5px}
.finfo .chip{margin-top:4px}
.pacts{display:flex;align-items:center;gap:6px;color:var(--muted)}
.frow .date{flex:0 0 auto}
.fline{font-size:13px;color:var(--green);margin-top:5px;line-height:1.35}
.fline b{font-weight:600}
.atw{display:flex;align-items:center;gap:4px}.atw span{font-weight:600;color:var(--muted)}.atw input{flex:1}
#aq{width:100%}
.tabbar a{position:relative}
.dotn{position:absolute;top:2px;left:calc(50% + 6px);min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--red);color:#fff;font:700 11px/17px Inter,sans-serif;text-align:center}
.dotn[hidden]{display:none}
.pcount button{position:relative}
.pdot{position:absolute;top:6px;right:22%;width:9px;height:9px;border-radius:50%;background:var(--red)}
/* hojas */
.ovl{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:10}
.ovl.show{display:flex}
.sheet{background:var(--card);width:100%;max-width:720px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px 16px 24px}
.sheet h2{font:700 22px "Barlow Condensed",sans-serif;text-transform:uppercase;margin:0 0 12px}
label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin:10px 0 4px}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:15px Inter,sans-serif}
textarea{min-height:64px;resize:vertical}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg button{padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:600 14px Inter,sans-serif;cursor:pointer}
.seg button.on.inscrito{background:var(--green);border-color:var(--green);color:var(--card)}
.seg button.on.interesado{background:var(--amber);border-color:var(--amber);color:var(--card)}
.btns{display:flex;gap:8px;margin-top:18px}
.btn{flex:1;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:600 15px Inter,sans-serif;cursor:pointer}
.btn.pri{background:var(--green);border-color:var(--green);color:var(--card)}
.btn.del{flex:0 0 auto;color:var(--red);border-color:var(--red2);background:var(--red2)}
a{color:var(--green)}
</style>
</head>

<script>
(function(){

  function saveUI(){ ui.dfilter = dfilter; try{ localStorage.setItem('rutas-ui', JSON.stringify(ui)); }catch(e){} }

  if(!state.prefs || typeof state.prefs !== 'object') state.prefs = {};

  function commitZona(){ const now = [...fprovs].sort(), prev = (state.prefs.provs||[]).slice().sort(); if(JSON.stringify(now) !== JSON.stringify(prev)){ state.prefs.provs = now; save(); } }
  const now = new Date(); let calY = now.getFullYear(), calM = now.getMonth();

  const $ = s => document.querySelector(s);
  const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const MESES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  const MESES_L = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  const TIPOS = {senderismo:'🥾 Senderismo', trail:'🏃 Trail', carrera:'👟 Carrera', mtb:'🚵 MTB', otro:'🏁 Otro'};
  const tipoTxt = t => TIPOS[t] || TIPOS.otro;
  const tiposOf = x => (x.tipos && x.tipos.length) ? x.tipos : [x.tipo || 'otro'];
  const tiposTxt = x => tiposOf(x).map(tipoTxt).join(' + ');
  const today = () => { const d = new Date(); d.setHours(0,0,0,0); return d; };

  const iso = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  const days = s => Math.round((pd(s) - today())/86400000);
  const fmtDays = n => n===0 ? 'hoy' : n===1 ? 'mañana' : n>0 ? `en ${n} días` : `hace ${-n} días`;
  const precioTxt = p => +p===0 ? 'Gratis' : esc(p)+' €';

  // ---------- provincias (mapa en rejilla) ----------

  const PROVS = Object.keys(MAPPTS).map(n => [n]);
  const ALIAS = {'vizcaya':'Bizkaia','guipuzcoa':'Gipuzkoa','guipúzcoa':'Gipuzkoa','araba':'Álava','alava':'Álava','la coruña':'A Coruña','coruña':'A Coruña','orense':'Ourense','gerona':'Girona','lérida':'Lleida','lerida':'Lleida','castelló':'Castellón','castellon':'Castellón','alacant':'Alicante','valència':'Valencia','illes balears':'Baleares','islas baleares':'Baleares','mallorca':'Baleares','tenerife':'Santa Cruz de Tenerife','gran canaria':'Las Palmas','almeria':'Almería','malaga':'Málaga','cadiz':'Cádiz','cordoba':'Córdoba','jaen':'Jaén','avila':'Ávila','caceres':'Cáceres','leon':'León','region de murcia':'Murcia','región de murcia':'Murcia','principado de asturias':'Asturias','comunidad de madrid':'Madrid'};
  const PNAMES = new Set(PROVS.map(p => p[0]));
  const normProv = p => { if(!p) return ''; if(PNAMES.has(p)) return p; const k = p.toLowerCase().trim(); if(ALIAS[k]) return ALIAS[k]; for(const n of PNAMES) if(n.toLowerCase() === k) return n; return p; };

  const MAPIMG = (document.getElementById('mapimg') || {}).textContent || '';
  let PATHS = {}; try { PATHS = JSON.parse(document.getElementById('mapsvg').textContent); } catch(e){}
  function mapHTML(counts){
    let svg = `<svg viewBox="0 0 759 600" xmlns="http://www.w3.org/2000/svg">`;
    Object.entries(PATHS).forEach(([n,d]) => { svg += `<path class="prov ${counts[n]?'has':''} ${fprovs.has(n)?'sel':''}" data-p="${esc(n)}" d="${d}"><title>${esc(n)}</title></path>`; });
    Object.entries(MAPPTS).forEach(([name,[x,y]]) => {
      const n = counts[name] || 0, sel = fprovs.has(name);
      const lab = name==='Baleares' ? 'Islas Baleares' : name==='Santa Cruz de Tenerife' ? 'Santa Cruz' : name; const w = Math.max(40, lab.length*7 + 12), hgt = (name==='Santa Cruz de Tenerife') ? 30 : 22;
      svg += `<g class="hot ${n?'has':''} ${sel?'sel':''}" data-p="${esc(name)}"><title>${esc(name)}${n?' · '+n+' eventos':''}</title>
        <rect class="hit" x="${x-w/2}" y="${y-hgt/2}" width="${w}" height="${hgt}" rx="7"/>
        ${n ? `<circle cx="${x+w/2-2}" cy="${y-hgt/2}" r="9"/><text x="${x+w/2-2}" y="${y-hgt/2+3.5}">${n}</text>` : ''}</g>`;
    });
    svg += '</svg>';
    return `<div class="mapscroll"><div class="mapinner ${mapZoom?'zoom':''}"><img src="data:image/jpeg;base64,${MAPIMG}" alt="Mapa de provincias de España">${svg}</div></div>`;
  }


  // ---------- confirmación ----------
  function confirmDlg(msg, detail, okTxt){
    return new Promise(res => {
      $('#cfmbox').innerHTML = `<p>${esc(msg)}</p>${detail ? `<span class="sub">${esc(detail)}</span>` : ''}<div class="btns"><button class="btn" id="cfmNo">Cancelar</button><button class="btn danger" id="cfmYes">${esc(okTxt||'Borrar')}</button></div>`;
      $('#cfm').classList.add('show');
      const done = v => { $('#cfm').classList.remove('show'); res(v); };
      $('#cfmNo').onclick = () => done(false); $('#cfmYes').onclick = () => done(true);
      $('#cfm').onclick = e => { if(e.target.id === 'cfm') done(false); };
    });
  }
  async function removeMine(e){
    const ok = await confirmDlg('¿Quitar de tu agenda?', `«${e.nombre}» (${e.estado==='inscrito'?'Inscrito':'Me interesa'}) se borrará de tu agenda.`, 'Quitar');
    if(!ok) return false;
    state.events = state.events.filter(x => x !== e); save(); return true;
  }
  function setEstado(e, estado){
    if(e.estado === estado) return removeMine(e);
    e.estado = estado; save();
  }

  // ---------- agenda ----------
  function myEvents(){ return state.events.slice().sort((a,b)=> (a.date||'').localeCompare(b.date||'')); }

  function renderAgenda(){
    const evs = myEvents();
    const prox = evs.filter(e => days(e.date) >= 0 && !e.done).length;
    const bd = $('#agBadge'); bd.hidden = !prox; bd.textContent = prox;
    const first = new Date(calY, calM, 1), start = new Date(first); start.setDate(1 - ((first.getDay()+6)%7));
    const byDay = {}; evs.forEach(e => { (byDay[e.date] = byDay[e.date] || []).push(e); });
    let h = `<div class="panel"><div class="calhead"><button class="nav" id="prevM">‹</button><b>${MESES_L[calM]} ${calY}</b><button class="nav" id="nextM">›</button></div><div class="cal">`;
    ['L','M','X','J','V','S','D'].forEach(d => h += `<div class="dow">${d}</div>`);
    const tIso = iso(today());
    for(let i=0;i<42;i++){
      const d = new Date(start); d.setDate(start.getDate()+i); const k = iso(d);
      const list = byDay[k] || [];
      h += `<div class="d ${d.getMonth()!==calM?'out':''} ${k===tIso?'today':''} ${k===selDay?'sel':''}" data-day="${k}">${d.getDate()}<div class="dots">${list.slice(0,3).map(e => `<span class="dot ${e.done || days(e.date)<0 ? 'hecha' : e.estado}"></span>`).join('')}</div></div>`;
      if(i===34 && d.getMonth()!==calM) break;
    }
    h += `</div><div class="legend"><span><i class="dot inscrito"></i>Inscrito</span><span><i class="dot interesado"></i>Me interesa</span><span><i class="dot hecha"></i>Pasada</span></div>`;
    // avisos de plazos
    evs.filter(e => e.estado==='interesado' && e.limite && days(e.date)>=0).forEach(e => {
      const n = days(e.limite);
      if(avisoDias() > 0 && n>=0 && n<=avisoDias()) h += `<div class="alert">⏰ <strong>Inscripción</strong> de <b>${esc(e.nombre)}</b> cierra ${fmtDays(n)}.</div>`;
      else if(avisoDias() > 0 && n<0) h += `<div class="alert">⚠️ El plazo de <b>${esc(e.nombre)}</b> ya cerró y sigue como «Me interesa».</div>`;
    });
    h += `</div>`;
    // lista
    let list = selDay ? evs.filter(e => e.date === selDay) : evs.filter(e => days(e.date) >= 0 && !e.done);
    h += `<div class="month" style="margin-top:14px">${selDay ? 'Día ' + pd(selDay).getDate() + ' de ' + MESES_L[pd(selDay).getMonth()].toLowerCase() + ' · <a href="#" id="clearDay">ver todas</a>' : 'Próximas en tu agenda'}</div>`;
    if(!list.length) h += `<div class="empty">${state.events.length ? 'Nada este día.' : 'Tu agenda está vacía.<br>Marca eventos como <b>Me interesa</b> o <b>Inscrito</b>, o pulsa <b>+ Añadir</b>.'}</div>`;
    list.forEach(e => h += cardMine(e));
    $('#agenda').innerHTML = h;
    $('#prevM').onclick = () => { calM--; if(calM<0){calM=11;calY--;} renderAgenda(); };
    $('#nextM').onclick = () => { calM++; if(calM>11){calM=0;calY++;} renderAgenda(); };
    document.querySelectorAll('.cal .d').forEach(el => el.onclick = () => { selDay = selDay === el.dataset.day ? null : el.dataset.day; renderAgenda(); });
    const cd = $('#clearDay'); if(cd) cd.onclick = ev => { ev.preventDefault(); selDay = null; renderAgenda(); };
    document.querySelectorAll('.ev.mine').forEach(c => c.onclick = ev => { if(ev.target.closest('button')) return; openForm(state.events.find(e => e.id === c.dataset.id)); });
    document.querySelectorAll('[data-mst]').forEach(b => b.onclick = ev => { ev.stopPropagation(); const e = state.events.find(x => x.id === b.dataset.mid); if(e) setEstado(e, b.dataset.mst); });
    document.querySelectorAll('[data-share-mine]').forEach(b => bindShare(b, () => state.events.find(x => x.id === b.dataset.shareMine)));
  }

  function cardMine(e){
    const d = pd(e.date), n = days(e.date);
    const tags = [];
    if(e.estado==='interesado' && e.limite) tags.push(`<span class="tag ${days(e.limite)<=Math.max(avisoDias(),3)?'bad':'warn'}">Inscripción hasta ${pd(e.limite).getDate()} ${MESES[pd(e.limite).getMonth()]}</span>`);

  function rangoFechas(){
    const t = today(); let a = null, b = null; const add = (d,n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
    switch(ffecha.modo){
      case 'finde': { const dow = t.getDay(); if(dow === 0){ a = t; b = t; } else { a = add(t, (6 - dow + 7) % 7); b = add(a, 1); } break; }
      case '7': a = t; b = add(t, 7); break;
      case '30': a = t; b = add(t, 30); break;
      case 'mes': a = t; b = new Date(t.getFullYear(), t.getMonth()+1, 0); break;
      case 'mesprox': a = new Date(t.getFullYear(), t.getMonth()+1, 1); b = new Date(t.getFullYear(), t.getMonth()+2, 0); break;
      case 'rango': a = ffecha.desde ? pd(ffecha.desde) : null; b = ffecha.hasta ? pd(ffecha.hasta) : null; break;

  const downloads = {
    async save({filename, data}){
      const file = new File([data], filename, {type: data.type || 'image/png'});
      if(navigator.canShare && navigator.canShare({files: [file]})){
        try { await navigator.share({files: [file]}); }
        catch(err){ if(err && err.name === 'AbortError') { const e = new Error('cancelado'); e.code = 'declined'; throw e; } throw err; }
        return;
      }
      const a = document.createElement('a'); a.href = URL.createObjectURL(data); a.download = filename; document.body.appendChild(a); a.click(); a.remove();
    }
  };
  const DIAS = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
  function wrap(ctx, text, maxW){
    const words = String(text||'').split(/\s+/), lines = []; let cur = '';
    words.forEach(w => { const t = cur ? cur + ' ' + w : w; if(ctx.measureText(t).width > maxW && cur){ lines.push(cur); cur = w; } else cur = t; });
    if(cur) lines.push(cur); return lines;
  }

        r = r.filter(p => p.id !== yo);
        const rel = id => AMI.filas.find(f => f.de === id || f.para === id);
        $('#ares').innerHTML = r.length ? r.map(p => { const f = rel(p.id); const btn = !f ? `<button class="chip greenl" data-sol="${esc(p.usuario)}">Añadir</button>` : f.estado === 'aceptada' ? '<span class="sub">Amigos ✓</span>' : f.para === yo ? `<button class="chip greenl" data-acc2="${f.id}">Aceptar</button>` : '<span class="sub">Pendiente</span>'; return filaPersona(p, btn); }).join('') : '<div class="sub" style="padding-top:8px">No hay nadie con ese nombre.</div>';
        document.querySelectorAll('[data-sol]').forEach(b => b.onclick = () => solicitar(b.dataset.sol));
        document.querySelectorAll('[data-acc2]').forEach(b => b.onclick = () => amistadAccion('aceptar_amistad', +b.dataset.acc2, '¡Ya sois amigos! ✓'));
      }, 350);
    };
  }
  function amigoPantalla(id){
    const p = AMI.perfiles.get(id) || {id, usuario: '', nombre: ''};
    const a = amigosAceptados().find(x => x.id === id);
    const rutas = AMI.agendas.get(id) || [];
    cfgPage(nombreDe(p), `
      <div class="cfgbox" style="text-align:center">${avatar(p, 84)}<div style="font-weight:700;font-size:18px;margin-top:8px">${esc(nombreDe(p))}</div><div class="sub">@${esc(p.usuario)}</div></div>
      <div class="cfglabel">Sus próximas rutas</div>
      <div class="cfgbox">${rutas.length ? rutas.map(r => {
        const d = r.date ? pd(r.date) : null, w = r.webId && state.web.find(x => x.id === r.webId), mine = r.webId && state.events.find(e => e.webId === r.webId);
        return `<div class="frow"><div class="date t-${esc(tiposOf(r)[0])}">${d ? `<b>${d.getDate()}</b><span>${MESES[d.getMonth()]}</span>` : ''}</div>
          <div class="finfo"><b>${esc(r.nombre || '')}</b><span>${r.estado === 'inscrito' ? '✓ Inscrito' : '★ Le interesa'}${r.lugar ? ' · ' + esc(r.lugar) : ''}</span>
          ${w ? (mine ? `<span class="sub">En tu agenda (${mine.estado === 'inscrito' ? 'inscrito' : 'me interesa'})</span>` : `<span><button class="chip amber" data-addf="${esc(w.id)}">★ Me interesa</button></span>`) : ''}</div></div>`; }).join('')
        : '<div class="sub">No tiene rutas próximas en su agenda.</div>'}</div>
      ${a ? '<div class="cfgfoot"><button class="cfgdanger" id="adel">Eliminar amigo</button></div>' : ''}`, true);
    $('#cfgx').onclick = amigosPantalla;
    document.querySelectorAll('[data-addf]').forEach(b => b.onclick = () => { addFromWeb(b.dataset.addf, 'interesado'); amigoPantalla(id); });
    const del = $('#adel'); if(del) del.onclick = async () => { if(await confirmDlg(`¿Eliminar a ${nombreDe(p)} de tus amigos?`, 'Dejaréis de ver vuestras rutas. Podéis volver a ser amigos más adelante.', 'Eliminar')){ await amistadAccion('eliminar_amistad', a.fila.id, 'Amigo eliminado'); amigosPantalla(); } };
  }
  function amigosReset(){ AMI = {cargado: false, filas: [], perfiles: new Map(), agendas: new Map(), porRuta: new Map(), yo: null, recibidas: 0}; marcarAvisos(); }
  document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'visible' && sesion) amigosCargar(); });
  if(sesion && !location.hash.includes('access_token')) setTimeout(async () => { await perfilAsegurar(); amigosCargar(); }, 700);
  else if(invitacion && !sesion) setTimeout(() => { toast('Crea tu cuenta para añadir a @' + invitacion); cuentaPantalla('registro'); }, 600);

  render(); showTab(); cargarEventos();
  document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'visible' && Date.now() - (window._evAt||0) > 3*3600e3){ window._evAt = Date.now(); cargarEventos(); } });
  window._evAt = Date.now();
  if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
</body>
</html>
